<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הנפשות אלגוריתמים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: playful but exact, like a good visual-algorithms lab.
   IDEA: VisuAlgo-style colour blocks — every state has its own bright colour.
   PICTURE: the running algorithm, large, on a white board.
   COLOUR and TYPE: orange = now, green = compared, cyan = finished, pink = changed; Rubik + JetBrains Mono.
   LAYOUT: topic rail, title + search, board with orange caption and transport, green code plate. */
:root{color-scheme:light;
  --bg:#fff; --ink:#222; --muted:#777; --line:#e6e6e6; --soft:#f5f5f5;
  --orange:#ff8a27; --orange-t:#ffe6d1; --green:#52bc69; --green-d:#2f8a46; --green-t:#dcf3e1;
  --cyan:#2ebbd1; --cyan-t:#d4f1f6; --pink:#e64980; --pink-t:#fde0ea; --gray:#bbb; --idle:#eee;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{font:16px/1.5 Rubik,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow-x:clip}
button,input{font:inherit;color:inherit}
header{flex-shrink:0;background:var(--orange);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:19px;font-weight:700;white-space:nowrap}
header h1 span{font-weight:400;opacity:.9}
#menuBtn{display:none;background:rgba(255,255,255,.2);border:0;border-radius:6px;width:40px;height:40px;cursor:pointer;font-size:18px;color:#fff}
.search{position:relative;flex:1 1 280px;max-width:520px;margin-inline-start:auto}
.search input{width:100%;height:42px;border:0;border-radius:6px;padding:0 40px 0 14px;font-size:15.5px;color:var(--ink);background:#fff}
.search input:focus{outline:3px solid rgba(255,255,255,.55)}
.search .ic{position:absolute;right:12px;top:10px;color:var(--orange);font-size:17px;pointer-events:none}
.results{position:absolute;top:48px;inset-inline:0;background:#fff;color:var(--ink);border-radius:8px;box-shadow:0 12px 36px rgba(0,0,0,.18);max-height:70vh;overflow-y:auto;z-index:20;padding:6px}
.results:empty{display:none}
.results .grp{font-size:12px;color:var(--muted);padding:8px 10px 2px}
.results a{display:block;padding:8px 10px;border-radius:6px;color:inherit;text-decoration:none;cursor:pointer}
.results a:hover,.results a.on{background:var(--orange-t)}
.results a b{font-weight:600}
.results a small{display:block;color:var(--muted);font-size:13px}
.results .none{padding:12px;color:var(--muted);font-size:14px}
.layout{flex:1;display:flex;min-height:0}
nav{width:248px;flex-shrink:0;background:var(--soft);overflow-y:auto;padding:6px 0 28px}
nav .topic{padding:12px 16px 3px;font-size:12.5px;color:var(--muted);font-weight:600;display:flex;gap:7px;align-items:center}
nav .topic i{font-style:normal;background:var(--cyan);color:#fff;border-radius:4px;font:700 11px "JetBrains Mono",monospace;padding:1px 5px}
nav button{display:block;width:100%;text-align:right;background:none;border:0;padding:6px 16px 6px 12px;font-size:14.5px;cursor:pointer;border-right:4px solid transparent}
nav button:hover{background:#ececec}
nav button.on{background:#fff;border-right-color:var(--orange);font-weight:600}
main{flex:1;overflow-y:auto;padding:18px clamp(12px,2vw,28px) 36px}
#welcome{max-width:760px;margin:5vh auto 0}
#welcome h2{font-size:clamp(28px,3.4vw,40px);line-height:1.1;margin:0 0 10px}
#welcome p{color:var(--muted);font-size:17px;margin:0 0 20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tiles button{border:0;border-radius:8px;padding:14px;text-align:right;cursor:pointer;color:#fff;font-weight:600;font-size:15px;min-height:76px}
.tiles button small{display:block;font-weight:400;opacity:.9;font-size:12.5px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.head .t{flex:1 1 360px}
.head h2{margin:0;font-size:clamp(23px,2.4vw,30px);line-height:1.15}
.head .tag{color:var(--muted);font-size:15.5px;margin-top:3px}
.badge{display:inline-block;font-size:12.5px;font-weight:600;border-radius:4px;padding:2px 8px;margin-top:6px}
.badge.lec{background:var(--cyan-t);color:#127f91}
.badge.ext{background:var(--pink-t);color:#b02a5b}
.badge.own{background:var(--idle);color:var(--muted)}
.tb{border:0;background:var(--idle);border-radius:6px;height:40px;padding:0 14px;cursor:pointer;font-size:14.5px;font-weight:500}
.tb:hover{background:#e2e2e2}
.tb[aria-expanded=true]{background:var(--ink);color:#fff}
.drawer{background:var(--soft);border-radius:8px;padding:14px 18px;margin-bottom:12px;line-height:1.75;font-size:15.5px}
.drawer b{color:var(--orange)}
.inputs{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
.inputs label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.inputs input,.inputs textarea{font:14.5px "JetBrains Mono",monospace;padding:9px 12px;border:2px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);direction:ltr;text-align:left}
.inputs input:focus,.inputs textarea:focus{outline:0;border-color:var(--orange)}
.inputs textarea{min-width:220px;min-height:100px;resize:vertical;font-size:13.5px}
.inputs .hint{font-size:12.5px;max-width:300px;line-height:1.5}
.btn{height:42px;padding:0 18px;border-radius:6px;border:0;background:var(--orange);color:#fff;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--idle);color:var(--ink)}
.err{color:var(--pink);font-size:14px;width:100%;font-weight:500}
.err:empty{display:none}
.knobs{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;background:var(--soft);border-radius:6px;padding:10px 14px;margin-bottom:12px}
.knobs:empty{display:none}
.knob{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.seg{display:inline-flex;border-radius:5px;overflow:hidden}
.seg button{border:0;background:#e6e6e6;padding:7px 13px;font-weight:600;font-size:14px;cursor:pointer}
.seg button:hover{background:#dcdcdc}
.seg button.on{background:var(--orange);color:#fff}
.seg button small{font-weight:400;opacity:.8;font-size:11.5px;margin-inline-start:3px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,370px);gap:14px;align-items:start}
.board{border:2px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.viz{padding:16px 12px 6px;min-height:320px;display:flex;flex-direction:column;justify-content:center;overflow-x:auto}
.viz svg{display:block;margin:0 auto;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:5px 14px;font-size:13px;color:var(--muted);padding:2px 12px 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block}
.legend i.e{width:20px;height:0;border-radius:0;border-top:4px solid}
.legend i.e.dash{border-top-style:dashed}
.caption{background:var(--orange);color:#fff;padding:11px 16px;font-size:16px;line-height:1.6;min-height:68px;display:flex;gap:10px;align-items:flex-start}
.caption .n{flex:none;font:700 12px "JetBrains Mono",monospace;background:rgba(255,255,255,.25);border-radius:4px;padding:2px 6px;margin-top:3px}
.caption code{background:rgba(255,255,255,.25);color:#fff}
.transport{display:flex;align-items:center;gap:7px;padding:9px 12px;background:#fff;border-top:2px solid var(--line)}
.ib{width:44px;height:42px;border-radius:5px;border:0;background:var(--idle);cursor:pointer;display:grid;place-items:center;flex:none}
.ib svg{width:17px;height:17px;fill:currentColor}
.ib:hover{background:#e2e2e2}
.ib.play{background:var(--orange);color:#fff;width:52px}
.ib:disabled{opacity:.35;cursor:default}
.scrub{flex:1;accent-color:var(--green);direction:rtl;height:26px}
.speed{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.speed input{width:70px;accent-color:var(--orange)}
.side{display:flex;flex-direction:column;gap:10px}
.code{background:var(--green);color:#fff;border-radius:6px;padding:12px 0;font:12.5px/1.7 "JetBrains Mono",Consolas,monospace;max-height:62vh;overflow:auto}
.code-title{font:600 13px Rubik,sans-serif;padding:0 14px 8px;opacity:.9}
#code{direction:ltr;text-align:left}
#code div{display:flex;white-space:pre-wrap;padding-right:12px}
#code .ln{flex:none;width:32px;text-align:right;padding-right:10px;opacity:.6;user-select:none}
#code .tx{flex:1;padding-left:2.5ch;text-indent:-2.5ch}
#code div.on{background:var(--green-d)}
#code.he{direction:rtl;text-align:right;font-family:Rubik,sans-serif;font-size:14px}
#code.he div{padding:0 0 0 12px}
#code.he .ln{text-align:left;padding:0 0 0 10px;font-family:"JetBrains Mono",monospace;font-size:12px}
#code.he .tx{padding:0 2ch 0 0;text-indent:-2ch}
#code .ltr{font-family:"JetBrains Mono",monospace;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border-radius:4px;padding:4px 10px;font-size:13px;display:inline-flex;gap:8px;align-items:baseline}
.chip span{color:var(--muted)}
.chip b{font:700 13px "JetBrains Mono",monospace;direction:ltr;unicode-bidi:isolate}
code,.ltr{direction:ltr;unicode-bidi:isolate;font-family:"JetBrains Mono",monospace;font-size:.9em}
code{background:var(--idle);padding:0 5px;border-radius:4px;white-space:nowrap}
/* arrays */
.arr{margin:4px 0 12px;text-align:center}
.arr .lbl{font-size:13px;color:var(--muted);margin-bottom:2px}
.arr .row{display:flex;direction:ltr;gap:4px;justify-content:center;flex-wrap:wrap}
.cell{width:46px;text-align:center}
.cell .ptr{height:22px;display:flex;align-items:flex-end;justify-content:center}
.cell .ptr em{font:700 10.5px "JetBrains Mono",monospace;font-style:normal;background:var(--ink);color:#fff;border-radius:3px;padding:0 4px;white-space:nowrap}
.box{height:46px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:var(--idle);font:700 16px "JetBrains Mono",monospace;transition:background .3s,color .3s,opacity .3s,transform .3s}
.cell .idx{font:11px "JetBrains Mono",monospace;color:var(--muted);margin-top:3px}
.box.cur{background:var(--orange);color:#fff;transform:translateY(-3px)}
.box.cmp,.box.cmpp{background:var(--green);color:#fff}
.box.sel{background:var(--pink);color:#fff;transform:translateY(-3px)}
.box.ok{background:var(--cyan);color:#fff}
.box.vis{background:var(--cyan-t)}
.box.dim{opacity:.25}
.box.empty{background:#fff;border:2px dashed var(--line)}
.cards{display:flex;flex-direction:column;gap:8px;max-width:440px;width:100%;margin:0 auto}
.card{border-radius:5px;padding:10px 14px;background:var(--idle);display:flex;justify-content:space-between;gap:12px;direction:ltr;font-weight:500;transition:background .3s,color .3s}
.card.cur{background:var(--orange);color:#fff}
.card.ok{background:var(--cyan);color:#fff}
.card code{background:none;padding:0;color:inherit}
.listbox{display:flex;direction:ltr;gap:4px;flex-wrap:wrap;align-items:center;min-height:34px;justify-content:center}
.listbox span{background:var(--cyan);color:#fff;border-radius:4px;padding:3px 11px;font:700 14px "JetBrains Mono",monospace}
.listbox em{color:var(--muted);font-style:normal;font-size:13px}
.sublabel{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;direction:ltr}
.two>div{direction:rtl}
.two .t{font-size:13px;color:var(--muted);text-align:center;font-weight:500}
.formula{direction:ltr;text-align:left;font:12.5px/1.85 "JetBrains Mono",monospace;background:var(--soft);border-radius:5px;padding:8px 12px;max-height:150px;overflow:auto;margin-top:6px}
.formula .new{background:var(--orange-t);border-radius:3px}
.formula .ok{color:var(--green-d)}
.table{margin:10px auto 0;border-collapse:separate;border-spacing:3px;font:13.5px "JetBrains Mono",monospace;direction:ltr}
.table td{padding:3px 10px;text-align:center}
.table td.h{color:var(--muted);font-family:Rubik,sans-serif;font-size:12.5px;text-align:right}
.table td.v{background:var(--idle);border-radius:4px;font-weight:700;transition:background .3s}
.table td.v.cur{background:var(--orange);color:#fff}
.table td.v.ok{background:var(--cyan);color:#fff}
/* svg */
svg{direction:ltr;overflow:visible}
svg text{font-family:"JetBrains Mono",monospace}
.nd{transition:transform .5s ease,opacity .3s}
.eg .lb{transition:transform .5s ease}
.nd circle,.nd rect{fill:var(--idle);stroke:#999;stroke-width:1.6;transition:cx .5s ease,cy .5s ease,x .5s ease,y .5s ease,fill .3s,stroke .3s,opacity .3s}
.nd text{font-size:14px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central;transition:x .5s ease,y .5s ease,fill .3s}
.nd text.sub{font-size:12px;fill:var(--pink)}
.nd.vis circle,.nd.vis rect{fill:var(--cyan-t);stroke:var(--cyan);stroke-width:2.2}
.nd.cur circle,.nd.cur rect{fill:var(--orange);stroke:var(--orange)}
.nd.done circle,.nd.done rect{fill:var(--cyan);stroke:var(--cyan)}
.nd.sel circle,.nd.sel rect{fill:var(--pink);stroke:var(--pink)}
.nd.cmp circle,.nd.cmp rect{fill:var(--green);stroke:var(--green)}
.nd.cur text:not(.sub),.nd.done text:not(.sub),.nd.sel text:not(.sub),.nd.cmp text:not(.sub){fill:#fff}
.nd.dim{opacity:.3}
.nd.S circle{fill:var(--cyan);stroke:var(--cyan)}.nd.S text:not(.sub){fill:#fff}
.nd.T circle{fill:var(--pink-t);stroke:var(--pink)}
.eg path{stroke:var(--gray);stroke-width:2;fill:none;stroke-linecap:round;transition:d .5s ease,stroke .3s,stroke-width .3s,opacity .3s}
.eg .lb rect{fill:#fff;stroke:#ddd;stroke-width:1;transition:x .5s,y .5s}
.eg .lb text{font-size:11.5px;font-weight:700;fill:#555;text-anchor:middle;dominant-baseline:central;transition:x .5s,y .5s}
.eg.tree path,.eg.flow path{stroke:var(--cyan);stroke-width:3.6}
.eg.match path{stroke:var(--green);stroke-width:4.4}
.eg.cand path{stroke:var(--green);stroke-width:2.4;stroke-dasharray:6 5}
.eg.cur path,.eg.path path{stroke:var(--orange);stroke-width:4.2}
.eg.cut path{stroke:var(--pink);stroke-width:3.4;stroke-dasharray:8 5}
.eg.dim{opacity:.2}
.eg.tree .lb text,.eg.flow .lb text{fill:#127f91}
.eg.cur .lb rect,.eg.path .lb rect{fill:var(--orange);stroke:var(--orange)}.eg.cur .lb text,.eg.path .lb text{fill:#fff}
.eg.match .lb text{fill:var(--green-d)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:1100px){.stage{grid-template-columns:1fr}.code{max-height:none}}
@media (max-width:760px){
  #menuBtn{display:block}
  header h1 span{display:none}
  nav{position:fixed;top:0;bottom:0;right:0;z-index:30;box-shadow:-10px 0 30px rgba(0,0,0,.2);display:none;padding-top:14px}
  nav.open{display:block}
  .two{grid-template-columns:1fr}
  .speed{display:none}
  .cell{width:36px}.box{height:38px;font-size:14px}
  .viz{min-height:240px}
}
</style>
</head>
<body>
<header>
  <button id="menuBtn" aria-label="תפריט">☰</button>
  <h1>הנפשות <span>· יסודות האלגוריתמים והסיבוכיות</span></h1>
  <div class="search">
    <span class="ic">⌕</span>
    <input id="q" type="search" placeholder="חפשו בחומר: למשל ״מסלול קצר״, ״ערימה״, ״רדוקציה״" autocomplete="off" aria-label="חיפוש בחומר הקורס">
    <div class="results" id="results"></div>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main">
    <div id="welcome">
      <h2>כל האלגוריתמים של הקורס, בתנועה</h2>
      <p>בחרו אלגוריתם וראו אותו רץ צעד אחר צעד, על הדוגמה מההרצאה או על קלט משלכם. אפשר גם לחפש למעלה.</p>
      <div class="tiles" id="tiles"></div>
    </div>
    <div id="algo" hidden>
      <div class="head">
        <div class="t"><h2 id="algoName"></h2><div class="tag" id="tag"></div><span class="badge" id="badge"></span></div>
        <button class="tb" id="tInfo" aria-expanded="false">הסבר</button>
        <button class="tb" id="tInput" aria-expanded="false">שינוי הקלט</button>
      </div>
      <div class="drawer" id="intro" hidden></div>
      <div class="drawer" id="inputsBox" hidden><div class="inputs" id="inputs"></div></div>
      <div class="knobs" id="knobs"></div>
      <div class="stage">
        <div class="board">
          <div class="viz" id="viz"></div>
          <div class="legend" id="legend"></div>
          <div class="caption"><span class="n" id="count"></span><div id="msg"></div></div>
          <div class="transport">
            <button class="ib" id="bFirst" aria-label="להתחלה" title="להתחלה"><svg viewBox="0 0 24 24"><path d="M17.5 5H20v14h-2.5zM3 5v14l7-7zM10 5v14l7-7z"/></svg></button>
            <button class="ib" id="bPrev" aria-label="צעד קודם" title="צעד קודם (→)"><svg viewBox="0 0 24 24"><path d="M5 5v14l11-7zM17 5h2.5v14H17z" opacity=".95"/></svg></button>
            <button class="ib play" id="bPlay" aria-label="הפעלה" title="הפעלה / עצירה (רווח)"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 5v14l11-7z"/></svg></button>
            <button class="ib" id="bNext" aria-label="צעד הבא" title="צעד הבא (←)"><svg viewBox="0 0 24 24"><path d="M19 5v14L8 12zM4.5 5H7v14H4.5z"/></svg></button>
            <input type="range" class="scrub" id="scrub" min="0" max="0" value="0" aria-label="מיקום בהנפשה">
            <label class="speed">מהירות<input type="range" id="speed" min="0" max="100" value="45"></label>
          </div>
        </div>
        <div class="side">
          <div class="code"><div class="code-title">פסאודו-קוד</div><div id="code"></div></div>
          <div class="chips" id="vars"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
"use strict";
/* ================== helpers ================== */
const INF = Infinity;
const clone = o => JSON.parse(JSON.stringify(o, (k, v) => v === Infinity ? "__INF__" : v),
                              (k, v) => v === "__INF__" ? Infinity : v);
const fmt = v => v === Infinity ? "∞" : (v === null || v === undefined ? "–" : String(v));
const c = s => `<code>${s}</code>`;
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const NAME_RE = "[A-Za-z0-9_֐-׿']+";

function parseNums(str, what) {
  const parts = String(str).split(/[\s,;|]+/).filter(Boolean);
  if (!parts.length) throw `צריך לכתוב ${what}.`;
  return parts.map(p => { const v = Number(p); if (!Number.isFinite(v)) throw `"${esc(p)}" הוא לא מספר.`; return v; });
}
function parseInt1(str, what) { const v = Number(String(str).trim()); if (!Number.isInteger(v)) throw `${what} צריך להיות מספר שלם.`; return v; }
function sortIds(ids) {
  return ids.slice().sort((a, b) => {
    const na = Number(a), nb = Number(b);
    if (Number.isFinite(na) && Number.isFinite(nb)) return na - nb;
    return String(a).localeCompare(String(b), "he");
  });
}
function parseGraph(text, { weighted = false, directed = false } = {}) {
  const items = String(text).split(/[\n;,]+/).map(s => s.trim()).filter(Boolean);
  const re = new RegExp(`^(${NAME_RE})\\s*(?:->|→|-|–|\\s)\\s*(${NAME_RE})(?:\\s*:?\\s*(\\d+(?:\\.\\d+)?))?$`);
  const nodes = new Set(), edges = [];
  for (const it of items) {
    const m = it.match(re);
    if (!m) throw `לא הצלחתי להבין את השורה "${esc(it)}". כתבו קשת כמו ${c(weighted ? "1-2 4" : "1-2")}.`;
    const [, u, v, w] = m;
    if (u === v) throw `קשת מצומת לעצמו ("${esc(it)}") לא נתמכת.`;

algo({
  id: "gcd", topic: "01", name: "האלגוריתם של אוקלידס (GCD)",
  tag: "מוצאים מחלק משותף מקסימלי בעזרת שאריות.", kw: "gcd euclid אוקלידס מחלק משותף שארית mod", src: "הרצאה 1",
  intro: `<b>מה זה?</b> אלגוריתם שמוצא את המחלק המשותף הגדול ביותר של שני מספרים ${c("x > y")}. הרעיון: מחשבים את השארית ${c("x mod y")}. אם היא 0, אז ${c("y")} הוא התשובה. אחרת ממשיכים עם הזוג ${c("(y, x mod y)")}, שהוא זוג קטן יותר עם אותו מחלק משותף.<br><b>בהרצאה:</b> הדוגמה ${c("GCD(27,15)")}, שהתשובה שלה היא 3.`,
  code: ["GCD(x, y)", "  r = x mod y", "  If r = 0 Then Return y", "  Return GCD(y, r)"],
  inputs: [{ key: "xy", label: "שני מספרים x, y", def: "27, 15", size: 14 }],
  parse(i) {
    const v = parseNums(i.xy, "שני מספרים");
    if (v.length !== 2 || !v.every(n => Number.isInteger(n) && n > 0)) throw "צריך שני מספרים שלמים וחיוביים, למשל 27, 15.";
    let [x, y] = v; if (x < y) [x, y] = [y, x];
    if (x === y) throw "צריך x > y (שני מספרים שונים).";
    return { x, y };
  },
  run({ x, y }) {
    const S = [], calls = [];
    const snap = (line, msg, vars) => S.push({ line, msg, vars, calls: clone(calls) });
    let a = x, b = y;
    while (true) {
      calls.push({ t: `GCD(${a}, ${b})`, note: "", st: "cur" });
      snap(0, `קוראים ל-${c(`GCD(${a}, ${b})`)}.`, [["x", a], ["y", b]]);
      const r = a % b;
      calls[calls.length - 1].note = `${a} mod ${b} = ${r}`;
      snap(1, `מחשבים את השארית: ${c(`${a} mod ${b} = ${r}`)}.`, [["x", a], ["y", b], ["r", r]]);
      if (r === 0) {
        calls[calls.length - 1].note += " → מחזירים " + b;
        calls.forEach(cl => cl.st = "ok");
        snap(2, `השארית היא 0, כלומר ${b} מחלק את ${a}. לכן מחזירים ${c(b)}, והתשובה היא <b>${b}</b>.`, [["x", a], ["y", b], ["r", r], ["פלט", b]]);
        break;
      }
      snap(2, `השארית ${r} היא לא 0, אז ממשיכים.`, [["x", a], ["y", b], ["r", r]]);
      calls[calls.length - 1].st = "";
      snap(3, `קוראים ל-${c(`GCD(${b}, ${r})`)}: המחלק המשותף של ${a} ו-${b} הוא אותו מחלק משותף של ${b} ו-${r}.`, [["x", a], ["y", b], ["r", r]]);
      [a, b] = [b, r];
    }
    return S;
  },
  render(st) {
    return `<div class="cards">${st.calls.map((cl, k) => `<div class="card ${cl.st}" data-k="g${k}"><code>${cl.t}</code> ${cl.note ? `<span class="ltr">${esc(cl.note)}</span>` : ""}</div>`).join("")}</div>`;
  },
});

algo({
  id: "naive", topic: "02", name: "המיון הנאיבי (FindMin)",
  tag: "בכל סיבוב מוצאים את הקטן ביותר ומעבירים אותו לפלט.", kw: "findmin מינימום מיון נאיבי sort", src: null,
  intro: `<b>מה זה?</b> מיון פשוט: בכל סיבוב מוצאים את האיבר הקטן ביותר במערך ${c("A")} בעזרת ${c("FindMin")}, מעתיקים אותו למקום הבא במערך הפלט ${c("B")}, ומסמנים אותו ב-${c("A")} כ-${c("∞")} כדי שלא ייבחר שוב.<br><b>זמן ריצה:</b> כל ${c("FindMin")} עולה ${c("O(n)")}, ועושים ${c("n")} סיבובים, ולכן בסך הכול ${c("O(n²)")}.`,
  code: ["Sort(A[1,…,n])", "  min = 0.", "  idxA = 1.", "  idxB = 1.", "  While idxB ≤ n Do", "    (min, idxA) = FindMin(A[1, …, n]).", "    B[idxB] = min.", "    A[idxA] = ∞.", "    idxB := idxB + 1.", "  End While.", "  Return B[1, …, n].", "",
    "FindMin(A[1,…,n])", "  i = 1.", "  min = A[1].", "  idx = 1.", "  While i ≤ n Do", "    If A[i] < min Then", "      min = A[i].", "      idx = i.", "    End If.", "    i := i + 1.", "  End While.", "  Return (min,idx)."],
  legend: [["cur","i – בודקים עכשיו"],["sel","המינימום עד עכשיו"],["ok","כבר ב-B"]],
  inputs: [{ key: "a", label: "המערך A", def: "5, 24, 4, 1, 13, 10", hint: "עד 10 מספרים" }],
  parse(i) { const a = parseNums(i.a, "מערך"); if (a.length > 10) throw "עד 10 מספרים, כדי שההנפשה תהיה ברורה."; return { a }; },
  run({ a }) {
    const n = a.length, A = a.slice(), B = Array(n).fill(null), S = [];
    const snap = (line, msg, x = {}) => S.push({ line, msg, A: A.slice(), B: B.slice(), ...x, vars: x.vars });
    snap(0, `מתחילים: ${c("A")} הוא הקלט, ${c("B")} ריק.`);
    snap([1, 2, 3], `מאתחלים ${c("min = 0")}, ${c("idxA = 1")}, ${c("idxB = 1")}.`, { vars: [["idxB", 1]] });
    for (let ib = 1; ib <= n; ib++) {
      snap(4, `${c(`idxB = ${ib} ≤ ${n}`)}, אז ממשיכים: צריך למצוא את האיבר שיגיע ל-${c(`B[${ib}]`)}.`, { ib, vars: [["idxB", ib]] });
      let i = 1, mn = A[0], id = 1;
      snap([13, 14, 15], `${c("FindMin")}: מתחילים עם ${c(`min = A[1] = ${fmt(mn)}`)} ו-${c("idx = 1")}.`, { ib, i, id, vars: [["idxB", ib], ["i", i], ["min", fmt(mn)], ["idx", id]] });
      for (; i <= n; i++) {
        const v = A[i - 1];
        if (v < mn) {
          mn = v; id = i;
          snap([17, 18, 19], `${c(`A[${i}] = ${fmt(v)}`)} קטן מהמינימום שהיה, אז מעדכנים: ${c(`min = ${fmt(mn)}`)}, ${c(`idx = ${id}`)}.`, { ib, i, id, vars: [["idxB", ib], ["i", i], ["min", fmt(mn)], ["idx", id]] });
        } else {
          snap(17, `${c(`A[${i}] = ${fmt(v)}`)} לא קטן מ-${c(`min = ${fmt(mn)}`)}, אז לא משנים כלום.`, { ib, i, id, vars: [["idxB", ib], ["i", i], ["min", fmt(mn)], ["idx", id]] });
        }
      }
      snap(23, `${c("FindMin")} סיים: האיבר הקטן ביותר הוא ${c(fmt(mn))}, במקום ${c(id)}.`, { ib, id, vars: [["idxB", ib], ["min", fmt(mn)], ["idxA", id]] });
      B[ib - 1] = mn;
      snap(6, `מעתיקים אותו: ${c(`B[${ib}] = ${fmt(mn)}`)}.`, { ib, id, vars: [["idxB", ib], ["min", fmt(mn)], ["idxA", id]] });
      A[id - 1] = INF;

const MERGE_CODE = ["Merge(B1[1,…,n/2], B2[1,…,n/2])", "  idx = idx1 = idx2 = 1.", "  While idx1 ≤ n/2 and idx2 ≤ n/2 Do", "    If B1[idx1] ≤ B2[idx2] Then B[idx] = B1[idx1] and idx1 = idx1 + 1.", "    Else B[idx] = B2[idx2] and idx2 = idx2 + 1.", "    End If.", "    idx = idx + 1.", "  End While.", "  If idx1 > n/2 Then B[idx,…,n] = B2[idx2,…,n/2].", "  If idx2 > n/2 Then B[idx,…,n] = B1[idx1,…,n/2].", "  Return B."];

}

const MERGEK_CODE = k => [`Merge(B1,…,B${k})`, `  idx = 1, idx1 = … = idx${k} = 1.`, "  While some Bj still has elements Do", "    Let j be the array with the smallest Bj[idxj].", "    B[idx] = Bj[idxj] and idxj = idxj + 1.", "    idx = idx + 1.", "  End While.", "  Return B."];

}

/* search path generator: yields steps, returns {x, parent, side} */

    })(s);

  },

  },

algo({
  id: "prim", topic: "07", name: "האלגוריתם של Prim",
  tag: "מגדלים עץ: בכל צעד מוסיפים את הקשת הקלה שיוצאת ממנו.", kw: "prim עץ פורש מינימלי mst", src: "הרצאה 7, שקף 13",
  intro: `<b>מה זה עץ פורש מינימלי?</b> קבוצת קשתות שמחברת את כל הצמתים, בלי מעגלים, כך שסכום המשקלים הוא הקטן ביותר האפשרי.<br><b>הרעיון של Prim:</b> מתחילים מצומת אחד ומגדלים עץ. בכל צעד מסתכלים על כל הקשתות שמחברות צומת שכבר בעץ ("visited") לצומת שעוד לא בעץ, ומוסיפים את <b>הקלה ביותר</b> מביניהן.<br><b>זמן ריצה:</b> במימוש פשוט ${c("O(nm)")}, ועם ערימה ${c("O(m lg n)")}.`,
  opts: [{ key: "mx", label: "עץ פורש:", def: false, choices: [[false, "מינימלי", "כמו בהרצאה"], [true, "מקסימלי"]] }],
  code: o => ["Prim(G=(V,E))", "  Initially, all vertices are marked \"not visited\".", "  T = ∅.", "  Mark arbitrary vertex as \"visited\".", "  While there exists a vertex \"not visited\" Do", `    Let {i,j} be the ${o.mx ? "maximum" : "minimum"} weight edge between`, "        \"visited\" vertices i and \"not visited\" vertices j.", "    Mark j as \"visited\".", "    Add {i,j} to T.", "  End While."],
  legend: [["vis","בעץ"],["sel","נוסף עכשיו"],["e:cand","מועמדות"],["e:cur","הקלה ביותר"],["e:tree","ב-T"]],
  inputs: gInputs("1-2 2\n1-3 5\n1-4 4\n2-3 2\n2-5 7\n2-6 4\n3-4 1\n3-6 3\n4-6 4\n5-6 1\n5-7 5\n6-7 7", { weighted: true, startLabel: "הצומת הראשון" }),
  parse(i) { return gParse(i, { weighted: true }); },
  run(input) {
    const MX = input.__opt.mx;
    const { g, s } = input;
    const pos = gPos(g, s, input, PRE.l7), S = [], vis = new Set(), T = [];
    let total = 0;
    const snap = (line, msg, x = {}) => {
      const nc = {}; vis.forEach(v => nc[v] = "vis"); if (x.j) nc[x.j] = "sel";
      const ec = {}; (x.cand || []).forEach(e => ec[edgeKey(e.u, e.v)] = "cand"); T.forEach(e => ec[edgeKey(e.u, e.v)] = "tree"); if (x.pick) ec[edgeKey(x.pick.u, x.pick.v)] = "cur";
      S.push({ line, msg, g, pos, nc, ec, vars: [["T", T.map(e => `{${e.u},${e.v}}`).join(" ") || "∅"], ["משקל T", total]] });
    };
    snap([1, 2], `כל הצמתים "not visited", ו-${c("T = ∅")}.`);
    vis.add(s);
    snap(3, `מסמנים את ${c(s)} כ-"visited". מכאן העץ יגדל.`);
    while (vis.size < g.nodes.length) {
      const cand = g.edges.filter(e => vis.has(e.u) !== vis.has(e.v));
      if (!cand.length) { snap(4, `<b>הגרף לא קשיר:</b> אין קשת מהצמתים ב-T לצמתים ${c(g.nodes.filter(v => !vis.has(v)).join(", "))}, ולכן אין עץ פורש.`); return S; }
      snap(4, `יש עוד צמתים שלא ב-T. הקשתות שחוצות בין "visited" ל-"not visited" (מקווקו): ${c(cand.map(e => `{${e.u},${e.v}}:${e.w}`).join(", "))}.`, { cand });
      const best = cand.reduce((a, b) => (MX ? b.w > a.w : b.w < a.w) ? b : a);

      vis.add(j); T.push(best); total += best.w;
      snap([7, 8], `מסמנים את ${c(j)} כ-"visited" ומוסיפים את ${c(`{${i},${j}}`)} ל-${c("T")}.`, { j });
    }
    snap(9, `<b>כל הצמתים ב-T.</b> העץ הפורש ה${MX ? "מקסימלי" : "מינימלי"} מכיל ${T.length} קשתות, והמשקל הכולל שלו הוא <b>${total}</b>.`);
    return S;
  },
  render(st) { return gDraw(st.g, st.pos, st.nc, st.ec); },

/* ---------- 08: Dijkstra ---------- */
const DIJ_NAIVE = ["Dijkstra(G=(V,E), s)", "  For each i ∈ V Do", "    Mark i as \"not visited\".", "    Set dist(i) = ∞ and father(i) = ⊥.", "  End For", "  Set dist(s) = 0.", "  While there exists a vertex \"not visited\" Do", "    Let i be a \"not visited\" vertex with minimum dist(i).", "    Mark i as \"visited\".", "    For each \"not visited\" j ∈ N(i) Do", "      If dist(i) + d(i,j) < dist(j) Then", "        dist(j) = dist(i) + d(i,j).", "        father(j) = i.", "      End If", "    End For", "  End While"];
const DIJ_HEAP = ["Dijkstra(G=(V,E), s)", "  For each i ∈ V Do", "    Mark i as \"not visited\".", "    Set dist(i) = ∞ and father(i) = ⊥.", "  End For", "  Set dist(s) = 0.", "  Create Heap H with all vertices sorted according to dist().", "  While there exists a vertex \"not visited\" Do", "    i = H.Pop().", "    Mark i as \"visited\".", "    For each \"not visited\" j ∈ N(i) Do", "      If dist(i) + d(i,j) < dist(j) Then", "        dist(j) = dist(i) + d(i,j).", "        H.DecreaseKey(j,dist(j))", "        father(j) = i.", "      End If", "    End For", "  End While", "", "DecreaseKey(j, val)", "  H[Aux[j]] = val.", "  HeapifyUp(Aux[j])."];
algo({
  id: "dijkstra", topic: "08", name: "האלגוריתם של Dijkstra",
  tag: "מרחקים קצרים מ-s: בכל צעד מקבעים את הצומת הקרוב ביותר.", kw: "dijkstra מסלול קצר מרחק dist father ערימה decreasekey aux", src: "הרצאה 8, שקף 10",
  intro: `<b>מה זה?</b> מציאת המרחק הקצר ביותר מצומת ${c("s")} לכל שאר הצמתים, בגרף מכוון עם משקלים <b>לא שליליים</b>. לכל צומת שומרים ${c("dist")}, המרחק הכי טוב שמצאנו עד עכשיו, ו-${c("father")}, מאיפה הגענו. בכל צעד בוחרים את הצומת שעוד לא ביקרנו בו עם ה-${c("dist")} הקטן ביותר. המרחק שלו כבר סופי, ומעדכנים דרכו את השכנים שלו.<br><b>עם ערימה (הרצאה 8, שקפים 34–38):</b> מחזיקים את כל הצמתים בערימת מינימום לפי ${c("dist")}, כך שמציאת הצומת הקרוב היא ${c("Pop")}. כש-${c("dist(j)")} קטן, עושים ${c("DecreaseKey")}: מוצאים את ${c("j")} בערימה בעזרת מערך העזר ${c("Aux")}, ומפעפעים אותו למעלה.<br><b>זמן ריצה:</b> במימוש פשוט ${c("O(n²)")}. עם ערימה ${c("O((n + m) lg n)")}.`,
  opts: [{ key: "impl", label: "מימוש:", def: "naive", choices: [["naive", "רגיל", "שקף 7"], ["heap", "עם ערימה", "שקף 38"]] }],
  code: o => o.impl === "heap" ? DIJ_HEAP : DIJ_NAIVE,
  legend: [["cur","i"],["cmp","j"],["done","מרחק סופי"],["e:tree","father"]],
  inputs: gInputs("1->2 3\n1->3 3\n1->4 1\n2->3 2\n3->2 2\n2->5 2\n2->6 4\n3->6 10\n4->3 1\n4->6 12\n4->7 9\n5->6 4\n6->7 2", { weighted: true, directed: true }),
  parse(i) { return gParse(i, { weighted: true, directed: true }); },
  run(input) {
    const { g, s } = input, HEAP = input.__opt.impl === "heap";
    const pos = gPos(g, s, input, PRE.l8), S = [], vis = new Set(), dist = {}, father = {};
    const D = true, L = HEAP ? { init: [1, 2, 3, 4], s: 5, loop: 7, mark: 9, forj: 10, rel: [11, 12, 14], relH: 13, no: 11, end: 17 } : { init: [1, 2, 3, 4], s: 5, loop: 6, mark: 8, forj: 9, rel: [10, 11, 12], no: 10, end: 15 };
    let H = [], last = -1; const aux = {};
    const snap = (line, msg, x = {}) => {
      const nc = {}; vis.forEach(v => nc[v] = "done"); if (x.i) nc[x.i] = "cur"; if (x.j) nc[x.j] = "cmp";
      const ec = {}; for (const v in father) if (father[v] !== null) ec[edgeKey(father[v], v, D)] = "tree";
      if (x.i && x.j) ec[edgeKey(x.i, x.j, D)] = "cur";
      const sub = {}; g.nodes.forEach(v => sub[v] = dist[v] === undefined ? "" : fmt(dist[v]));
      const hp = HEAP && H.length ? { H: H.slice(), last, aux: { ...aux }, hl: x.hl || {} } : null;
      S.push({ line, msg, g, pos, nc, ec, sub, hp, table: g.nodes.map(v => [v, dist[v], father[v]]), vars: [["i", x.i || "–"], ["j", x.j || "–"], ...(HEAP ? [["last", last]] : [])] });
    };
    const less = (a, b) => dist[H[a]] < dist[H[b]];
    const swapH = (p, q) => { [H[p], H[q]] = [H[q], H[p]]; aux[H[p]] = p; aux[H[q]] = q; };
    const down = (p, line, quiet) => {
      while (true) {
        const l = 2 * p + 1, r = 2 * p + 2; let m = p;
        if (l <= last && less(l, m)) m = l; if (r <= last && less(r, m)) m = r;
        if (m === p) { if (!quiet && l <= last) snap(line, `${c(H[p])} (dist ${fmt(dist[H[p]])}) לא גדול מהילדים שלו, אז הערימה תקינה.`, { hl: { [p]: "cur" } }); return; }
        if (!quiet) snap(line, `${c(H[p])} (dist ${fmt(dist[H[p]])}) גדול מהילד ${c(H[m])} (dist ${fmt(dist[H[m]])}), אז מחליפים ביניהם ומעדכנים את ${c("Aux")}.`, { hl: { [p]: "cur", [m]: "cmp" } });
        swapH(p, m); p = m;
      }
    };
    const up = (p, j, i) => {
      while (p > 0) {
        const q = Math.floor((p - 1) / 2);
        if (!less(p, q)) { snap(21, `${c(H[p])} (dist ${fmt(dist[H[p]])}) לא קטן מהאבא ${c(H[q])} (dist ${fmt(dist[H[q]])}), אז עוצרים.`, { i, j, hl: { [p]: "cur", [q]: "cmp" } }); return; }
        snap(21, `${c(H[p])} (dist ${fmt(dist[H[p]])}) קטן מהאבא ${c(H[q])} (dist ${fmt(dist[H[q]])}): מחליפים ומעדכנים את ${c("Aux")}.`, { i, j, hl: { [p]: "cur", [q]: "cmp" } });
        swapH(p, q); p = q;
      }
      snap(21, `${c(H[0])} הגיע לשורש.`, { i, j, hl: { 0: "cur" } });
    };
    g.nodes.forEach(v => { dist[v] = INF; father[v] = null; });
    snap(L.init, `לכל הצמתים ${c("dist = ∞")} ו-${c("father = ⊥")}. המספר מעל כל צומת הוא ה-${c("dist")} שלו.`);
    dist[s] = 0;
    snap(L.s, `${c(`dist(${s}) = 0`)}: המרחק מ-${s} לעצמו הוא 0.`);
    if (HEAP) {
      H = g.nodes.slice(); last = H.length - 1; H.forEach((v, p) => aux[v] = p);
      for (let p = Math.floor((H.length - 2) / 2); p >= 0; p--) down(p, 6, true);
      snap(6, `בונים ערימת מינימום מכל הצמתים לפי ${c("dist")} (בשיטת Floyd), ומאתחלים את ${c("Aux")}: לכל צומת, המקום שלו בערימה. ${c(s)} עם ${c("dist = 0")} נמצא בשורש.`, { hl: { 0: "cur" } });
    }
    while (vis.size < g.nodes.length) {
      let i;
      if (HEAP) {
        i = H[0];
        if (dist[i] === INF) { const rest = g.nodes.filter(v => !vis.has(v)); rest.forEach(v => vis.add(v)); snap([L.loop, 8, 9], `בשורש הערימה ${c("dist = ∞")}: לצמתים שנשארו (${c(rest.join(", "))}) אין מסלול מ-${s}.`); break; }
        snap(8, `${c("H.Pop()")}: בשורש נמצא ${c(i)}, עם ה-${c("dist")} הקטן ביותר (${c(dist[i])}).`, { i, hl: { 0: "cur" } });
        swapH(0, last); last--; aux[i] = "–";
        snap(8, `מעבירים את האחרון בערימה לשורש, מקטינים את ${c("last")}, ומפעפעים למטה.`, { i, hl: last >= 0 ? { 0: "cmp" } : {} });
        if (last > 0) down(0, 8, false);
      } else {
        const cand = g.nodes.filter(v => !vis.has(v));
        i = cand.reduce((a, b) => dist[b] < dist[a] ? b : a);
        if (dist[i] === INF) { cand.forEach(v => vis.add(v)); snap([6, 7, 8], `לכל הצמתים שנשארו (${c(cand.join(", "))}) המרחק הוא ${c("∞")}: אין אליהם מסלול מ-${s}. הם מסומנים "visited" ולא משתנה כלום.`); break; }
        snap([6, 7], `בין הצמתים שעוד לא ביקרנו בהם, ל-${c(i)} יש את ה-${c("dist")} הקטן ביותר: ${c(dist[i])}.${g.nodes.length > 1 ? ` (כדי למצוא אותו עברנו על ${cand.length} צמתים.)` : ""}`, { i });
      }
      vis.add(i);
      snap(L.mark, `מסמנים את ${c(i)} כ-"visited". המרחק שלו ${c(dist[i])} כבר סופי.`, { i });
      for (const j of neighbors(g, i, true)) {
        if (vis.has(j)) continue;
        const w = g.edges.find(e => e.u === i && e.v === j).w, nd = dist[i] + w;
        if (nd < dist[j]) {
          const old = dist[j]; dist[j] = nd; father[j] = i;
          if (HEAP) {
            snap([11, 12], `${c(`${dist[i]} + ${w} = ${nd} < ${fmt(old)}`)}: מעדכנים ${c(`dist(${j}) = ${nd}`)}.`, { i, j });
            snap([13, 20], `${c(`DecreaseKey(${j}, ${nd})`)}: לפי ${c("Aux")}, הצומת ${j} נמצא במקום ${c(aux[j])} בערימה. מעדכנים שם את הערך.`, { i, j, hl: { [aux[j]]: "cur" } });
            up(aux[j], j, i);
            snap(14, `${c(`father(${j}) = ${i}`)}.`, { i, j });
          } else snap(L.rel, `${c(`dist(${i}) + d(${i},${j}) = ${dist[i]} + ${w} = ${nd} < ${fmt(old)}`)}. מצאנו דרך קצרה יותר ל-${j}: מעדכנים ${c(`dist(${j}) = ${nd}`)} ו-${c(`father(${j}) = ${i}`)}.`, { i, j });
        } else snap(L.no, `${c(`dist(${i}) + d(${i},${j}) = ${nd} ≥ dist(${j}) = ${fmt(dist[j])}`)}. הדרך דרך ${i} לא טובה יותר, אז לא משנים.`, { i, j });
      }
    }
    snap(L.end, `<b>סיימנו.</b> המרחקים הסופיים מופיעים מעל הצמתים. הקשתות בתכלת (father) יוצרות את עץ המסלולים הקצרים: כדי לשחזר מסלול, הולכים מהיעד אחורה לפי ${c("father")}.`);
    return S;
  },
  render(st) {
    const table = `<table data-k="dt" style="margin:8px auto 0;border-collapse:collapse;font-size:13.5px;direction:ltr">${["צומת", "dist", "father"].map((h, r) => `<tr><td style="color:var(--muted);padding:2px 8px">${h}</td>${st.table.map(t => `<td style="border:1px solid var(--line);padding:3px 9px;text-align:center;font-weight:600">${r === 0 ? esc(t[0]) : r === 1 ? fmt(t[1]) : (t[2] === null || t[2] === undefined ? "⊥" : esc(t[2]))}</td>`).join("")}</tr>`).join("")}</table>`;
    const graph = gDraw(st.g, st.pos, st.nc, st.ec, { directed: true, sub: st.sub });
    if (!st.hp) return graph + table;
    const hp = st.hp, n = hp.last + 1, hl = {};
    for (let p = 0; p < n; p++) hl[p] = hp.hl[p] || "";
    const tree = drawHeapTree(hp.H.slice(0, n), hp.last, hl, hp.H.slice(0, n), 420, 2, hp.H.slice(0, n).map(v => fmt(st.table.find(t => t[0] === v)[1])));
    const auxRow = arrRow({ label: "Aux: המקום של כל צומת בערימה", vals: st.g.nodes.map(v => hp.aux[v]), ptr: Object.fromEntries(st.g.nodes.map((v, k) => [k, "צומת " + v])), idxShow: false, empty: v => v === "–" });
    return `${graph}<div class="two" data-k="dbot" style="margin-top:8px;align-items:center"><div><div class="sublabel" style="margin:0">הערימה H (מעל כל צומת: ה-dist שלו)</div>${tree}</div><div>${auxRow}${table}</div></div>`;
  },
});

/* ---------- 09: bipartite matching ---------- */
algo({
  id: "matching", topic: "09", name: "שידוך מקסימלי בגרף דו-צדדי",
  tag: "מגדילים את השידוך שוב ושוב בעזרת מסלולי שיפור.", kw: "matching שידוך דו צדדי מסלול שיפור berge", src: "הרצאה 9, שקף 25",
  intro: `<b>מה זה שידוך?</b> קבוצת קשתות ${c("M")} שאין לשתיים מהן צומת משותף. מחפשים שידוך עם כמה שיותר קשתות.<br><b>מסלול שיפור</b> הוא מסלול שמתחיל ונגמר בצמתים לא משודכים, והקשתות בו מתחלפות: לא ב-${c("M")}, ב-${c("M")}, לא ב-${c("M")}, וכן הלאה. אם "הופכים" את המסלול (${c("M ⊕ E(P)")}), השידוך גדל ב-1. לפי הלמה של Berge, אם אין מסלול שיפור, השידוך מקסימלי.<br><b>איך מוצאים מסלול שיפור?</b> בונים את ${c("H*(M)")}: קשתות שלא ב-${c("M")} מכוונים מ-${c("A")} ל-${c("B")}, קשתות ב-${c("M")} מכוונים מ-${c("B")} ל-${c("A")}, מוסיפים ${c("s")} עם קשתות לכל צומת לא משודך ב-${c("A")}, ו-${c("t")} עם קשתות מכל צומת לא משודך ב-${c("B")}. כל מסלול מ-${c("s")} ל-${c("t")} הוא מסלול שיפור. אפשר למצוא אותו עם BFS או עם DFS (בחרו למעלה).`,

        const from = right ? vid(i, j) : vid(i, j + 1), to = right ? vid(i, j + 1) : vid(i, j);
        const lit = clauses[j].find(l => l.v === v);
        if (owner[j] === i && lit && (a[v] !== lit.neg)) { go(from, "C" + j, `c${j}${i}a`); go("C" + j, to, `c${j}${i}b`); }
        else go(from, to, `p${i}_${j + 1}${right ? "f" : "b"}`);
      }
      prev = right ? vid(i, m) : vid(i, 0);
      snap(9, `${c(`${v} = ${a[v] ? 1 : 0}`)}: עוברים את השביל של ${v} ${a[v] ? "משמאל לימין" : "מימין לשמאל"}${owner.some(o => o === i) ? `, ובדרך עוקפים דרך ${owner.map((o, j) => o === i ? "C" + (j + 1) : null).filter(Boolean).join(", ")}` : ""}.`, { k, pathE: pathE.slice(), pathN: path.slice() });
    });
    go(prev, "t", prev + "t");
    snap(9, `<b>הגענו ל-t.</b> ההשמה ${c(vars.map(v => `${v}=${a[v] ? 1 : 0}`).join(", "))}${input.__default ? " (מההרצאה)" : ""} מספקת את כל הפסוקיות, ולכן עברנו בכל הצמתים: מסלול באורך ${pathE.length} = k.`, { k, pathE: pathE.slice(), pathN: path.slice() });
    return S;
  },
  render(st) {
    const hlN = new Set(st.hlN || []), pN = new Set(st.pathN || []), hlE = new Set(st.hlE || []), pE = new Set(st.pathE || []);
    const nodes = st.shown.map(id => { const nd = st.N[id]; return { id, x: nd.x, y: nd.y, label: nd.label, r: nd.r, cls: pN.has(id) ? (id[0] === "C" ? "sel" : "cur") : hlN.has(id) ? "cur" : id[0] === "C" ? "vis" : "" }; });
    const edges = st.E.map(e => ({ u: e.u, v: e.v, key: e.key, dir: true, bend: e.bend || (e.t === "var" ? 9 : 0), cls: pE.has(e.key) ? "path" : hlE.has(e.key) ? "cur" : (st.pathE ? "dim" : "") }));
    const side = `<div class="listbox" data-k="cl" style="margin-top:8px">${st.clauses.map((cl, j) => `<span data-k="q${j}" style="background:${st.shown.includes("C" + j) ? "var(--pink)" : "var(--idle)"};color:${st.shown.includes("C" + j) ? "#fff" : "var(--muted)"}">C${j + 1} = (${esc(cl.map(litS).join(" ∨ "))})</span>`).join("")}</div>`;
    return drawGraph({ w: st.W, h: st.H, nodes, edges }) + side;
  },
});

initUI();
</script>
</body>
</html>
